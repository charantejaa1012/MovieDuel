      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield/Square -->
  <rect width="48" height="48" rx="12" fill="#18181B" stroke="#3F3F46" stroke-width="2"/>
  
